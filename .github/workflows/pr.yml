name: Pull Request Validation

on:
  pull_request:
    branches: [ master, develop ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  comment:
    name: Comment PR
    needs: build-and-test
    # Fork PRs get a read-only token, so they can't comment; the check status still shows.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Comment PR
      uses: actions/github-script@v9
      env:
        RESULT: ${{ needs.build-and-test.result }}
      with:
        script: |
          const success = process.env.RESULT === 'success';
          const emoji = success ? '✅' : '❌';
          const status = success ? 'passed' : process.env.RESULT;
          const sha = context.payload.pull_request.head.sha.substring(0, 7);
          const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

          const body = `${emoji} Pull Request validation ${status}

          **Commit:** ${sha}
          **Workflow:** [${context.runId}](${runUrl})`;

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
