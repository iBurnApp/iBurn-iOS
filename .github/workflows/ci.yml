name: CI

# Pushes to the long-lived branches, plus manual runs from any branch. Pull requests are
# validated by pr.yml; both call build-and-test.yml so a PR isn't built twice.
on:
  push:
    branches: [ master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
